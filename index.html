<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JPNK Sports Arena – Slot Booking</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#EAF6FF;--bg2:#FFF6DC;--card:#fff;--night:#E4EAF8;--ink:#0B3C6F;--mute:#58728C;--blue:#1E78D2;--line:#CFE3F5;--sun:#FFC93C;--suntx:#3D2B00;--booked:#E6EAEF;--pend:#FFE9C7;--bad:#C23B22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1A2E;--bg2:#0A1A2E;--card:#12294A;--night:#0E2038;--ink:#E8F1FB;--mute:#93AECB;--blue:#5AA9F5;--line:#223F66;--booked:#1B2C44;--pend:#4A3A14;--bad:#FF8A70}}
:root[data-theme="dark"]{--bg:#0A1A2E;--bg2:#0A1A2E;--card:#12294A;--night:#0E2038;--ink:#E8F1FB;--mute:#93AECB;--blue:#5AA9F5;--line:#223F66;--booked:#1B2C44;--pend:#4A3A14;--bad:#FF8A70}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg) 0,var(--bg) 320px,var(--bg2) 100%);color:var(--ink);font:16px/1.45 'DM Sans',system-ui,sans-serif;padding-bottom:96px}
main{max-width:760px;margin:0 auto;padding:18px 16px}
h1,h2,.tot{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,8vw,42px);font-weight:800;line-height:1}
h2{font-size:19px;margin:22px 0 10px}
header{display:flex;align-items:center;gap:14px}
.ball{width:76px;height:76px;flex:none;animation:drop .9s ease-out 1}
.ball svg,.ball img{width:100%;height:100%;border-radius:50%;display:block}
@keyframes drop{0%{transform:translateY(-40px)}55%{transform:translateY(0)}72%{transform:translateY(-14px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.ball{animation:none}}
.sub{color:var(--mute);margin:4px 0 0;font-size:14px}
.net{height:26px;margin:16px 0 0;border-top:5px solid var(--card);border-radius:3px;background:repeating-linear-gradient(0deg,transparent 0 8px,var(--ink) 8px 9px),repeating-linear-gradient(90deg,transparent 0 8px,var(--ink) 8px 9px);opacity:.28}
.dates{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:thin}
.d{flex:0 0 auto;min-width:60px;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;text-align:center;cursor:pointer}
.d b{display:block;font-size:19px}.d small{color:var(--mute)}
.d[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}.d[aria-pressed=true] small{color:#e4f1ff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid var(--line);background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.s{padding:10px 12px;text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;min-height:62px}
.s.n{background:var(--night)}
.s b{display:block;font-size:15px}.s span{font-size:13px;color:var(--mute)}
.s[data-st=sel]{background:var(--sun);border-color:var(--sun);color:var(--suntx)}.s[data-st=sel] span{color:var(--suntx)}
.s[data-st=booked],.s[data-st=past]{background:var(--booked);color:var(--mute);cursor:not-allowed}.s[data-st=booked] b,.s[data-st=past] b{text-decoration:line-through}
.s[data-st=pending],.s[data-st=held]{background:var(--pend);cursor:not-allowed}
.s:focus-visible,.d:focus-visible,.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.msg{padding:10px 14px;border-radius:12px;background:var(--pend);margin:12px 0;font-size:14px}.msg.bad{color:var(--bad);border:2px solid var(--bad);background:transparent}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none}
#bar.on{display:block}#bar div{max-width:728px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{display:block;border:0;border-radius:14px;background:var(--blue);color:#fff;font:700 16px 'DM Sans',sans-serif;padding:13px 20px;cursor:pointer;text-align:center;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}.btn.bad{background:var(--bad)}.btn.pay{background:var(--sun);color:var(--suntx);font-size:18px;padding:16px}.btn.wa{background:#1FA855}.btn[disabled]{opacity:.5;cursor:not-allowed}.btn.sm{display:inline-block;padding:8px 12px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}
.qr{display:block;width:min(240px,70vw);margin:10px auto;border-radius:10px;border:6px solid #fff;image-rendering:pixelated}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--pend);color:var(--suntx)}.tag.ok{background:#1FA855;color:#fff}
.c{text-align:center}.c .ball{margin:0 auto 6px}.tot{font-size:26px;font-weight:800}
.code{display:inline-block;margin:10px 0 2px;padding:8px 18px;border:3px dashed var(--blue);border-radius:14px;font:800 28px 'Bricolage Grotesque',sans-serif;letter-spacing:.06em}
details{margin-top:12px;font-size:14px}summary{cursor:pointer;color:var(--blue);font-weight:700}
.apps{display:flex;gap:8px;margin-top:10px}.apps .btn{flex:1}
</style></head><body>

<div id="bar"><div><span id="sum"></span><button class="btn" id="go">Continue to pay</button></div></div>

const S={view:'pick',date:null,sel:new Set(),busy:new Set(),loaded:false,info:'',error:'',booking:null,accessToken:null,qr:null,expiresAt:0,owner:false,adminBookings:[]};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hr=h=>(h%12||12)+' '+(h%24<12?'AM':'PM'),lab=h=>hr(h)+' – '+hr(h+1),night=h=>h>=18||h<6,price=h=>night(h)?PRICE_NIGHT:PRICE_DAY;
const sid=(d,h)=>d+'_'+pad(h),parse=i=>{const[a,b]=i.split('_');return{d:a,h:+b}};
const when=i=>{const{d,h}=parse(i),[y,m,a]=d.split('-').map(Number);return new Date(y,m-1,a,h)};
const fd=d=>d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const esc=t=>String(t??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ids=()=>[...S.sel].sort(),total=l=>l.reduce((n,i)=>n+price(parse(i).h),0),desc=l=>l.map(i=>fd(when(i))+' · '+lab(parse(i).h));
const json=async(url,options={})=>{const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Request failed');return j};
async function loadAvailability(){S.loaded=false;render();try{const from=dkey(new Date()),to=dkey(new Date(Date.now()+13*86400000));const j=await json(`/api/availability?from=${from}&to=${to}`);S.busy=new Set(j.busy||[]);S.loaded=true;S.error='';}catch(e){S.error='Could not load live availability. Please refresh.';S.loaded=true;}render();}
function status(i){if(S.busy.has(i))return'booked';if(when(i)<new Date())return'past';return S.sel.has(i)?'sel':'free'}
function render(){const app=$('#app');$('#bar').classList.remove('on');let h='';if(S.error)h+=`<div class="msg bad">${esc(S.error)}</div>`;if(S.info)h+=`<div class="msg">${esc(S.info)}</div>`;
 if(S.view==='pay')h+=payHtml();else if(S.view==='done')h+=doneHtml();else if(S.view==='owner-login')h+=loginHtml();else if(S.view==='owner')h+=ownerHtml();else h+=pickHtml();app.innerHTML=h;
 if(S.view==='pick')bar();if(S.view==='pay')startPaymentPoll();}
function pickHtml(){const today=new Date();let h='<div class="dates" role="group" aria-label="Choose a date">';for(let k=0;k<DAYS;k++){const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+k),key=dkey(d);h+=`<button class="d" data-date="${key}" aria-pressed="${key===S.date}"><small>${d.toLocaleDateString('en-IN',{weekday:'short'})}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('en-IN',{month:'short'})}</small></button>`}h+='</div><div class="legend"><span><i></i>Free</span><span><i style="background:var(--sun);border-color:var(--sun)"></i>Your pick</span><span><i style="background:var(--booked)"></i>Booked</span><span>☀️ ₹400 · 🌙 floodlit ₹600 per hour</span></div>';if(!S.loaded)h+='<div class="msg">Loading live availability…</div>';
 [[0,6,'Late night · floodlit'],[6,12,'Morning'],[12,18,'Afternoon'],[18,24,'Evening · floodlit']].forEach(([a,b,n])=>{h+=`<h2>${n}</h2><div class="grid">`;for(let x=a;x<b;x++){const i=sid(S.date,x),st=status(i),tx={free:(night(x)?'🌙 ':'☀️ ')+'₹'+price(x),sel:'Picked · ₹'+price(x),booked:'Booked',past:'Passed'}[st];h+=`<button class="s${night(x)?' n':''}" data-slot="${i}" ${st==='free'||st==='sel'?'':'disabled'} aria-pressed="${st==='sel'}"><b>${lab(x)}</b><span>${tx}</span></button>`}h+='</div>'});h+='<p class="sub">Select one or more available hourly slots. Daytime: 6 AM–6 PM. Floodlit: 6 PM–6 AM.</p>';return h;}
function bar(){const l=ids();if(!l.length)return;$('#bar').classList.add('on');$('#sum').innerHTML=`<b>${l.length} hour${l.length>1?'s':''}</b> · ₹${total(l)}`;$('#go').disabled=!S.loaded;}
function payHtml(){const l=ids(),amt=total(l);return `<button class="btn alt sm" data-a="back" style="margin-top:12px">← Change slots</button><h2>Your slots</h2><div class="card">${desc(l).map(x=>`<div class="row"><span>${esc(x)}</span></div>`).join('')}<div class="row"><b>Total</b><span class="tot">₹${amt}</span></div><p class="sub" id="cd">Payment QR expires in 10 minutes.</p></div><div class="card"><label for="nm">Your name</label><input id="nm" autocomplete="name" value="${esc(S.customerName||'')}"><label for="ph">Your WhatsApp number</label><input id="ph" inputmode="numeric" maxlength="10" autocomplete="tel" value="${esc(S.customerPhone||'')}"><div class="msg bad" id="fe" hidden></div><button class="btn pay" id="create" style="width:100%;margin-top:14px" ${S.qr?'disabled':''}>${S.qr?'Payment QR generated':'Generate secure payment QR'}</button>${S.qr?`<div class="c"><p>Scan this QR using any UPI app and pay the exact amount.</p><img class="qr" src="${esc(S.qr)}" alt="Unique payment QR"><p class="sub">Booking reference: <b>${esc(S.booking)}</b></p><p class="sub">Do not click a paid button. Confirmation happens automatically after payment verification.</p></div>`:''}</div>`;}
function doneHtml(){const b=S.doneBooking||{};return `<div class="card c"><div class="ball">${LOGO}</div><div class="tot">${b.status==='confirmed'?'Slot confirmed!':'Waiting for payment confirmation'}</div><p>${b.status==='confirmed'?'Payment verified. Your court booking is confirmed.':'Your booking request is recorded. This page checks payment status automatically.'}</p><div class="code">${esc(b.code||S.booking||'')}</div><p class="sub">Your booking code</p><div style="margin:10px 0">${desc(b.slots||[]).map(x=>`<div>${esc(x)}</div>`).join('')}</div><p>Total: ₹${b.amount||''}</p><button class="btn alt" data-a="again" style="width:100%;margin-top:6px">Book more slots</button></div>`;}
function loginHtml(){return `<h2>Owner access</h2><div class="card"><label for="adminpw">Owner password</label><input id="adminpw" type="password" autocomplete="current-password"><div id="loginerr" class="msg bad" hidden></div><button class="btn" id="login" style="width:100%">Sign in</button></div>`;}
function ownerHtml(){let h='<button class="btn alt sm" data-a="home">← Booking page</button><h2>Owner: bookings</h2><button class="btn alt sm" id="refreshAdmin">Refresh bookings</button>';if(!S.adminBookings.length)h+='<div class="card">No bookings yet.</div>';S.adminBookings.forEach(b=>{h+=`<div class="card"><b>${esc(b.code)}</b> <span class="tag${b.status==='confirmed'?' ok':''}">${esc(b.status)}</span><br>${esc(b.name)} · <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a><br>₹${b.amount}<br>${desc(b.slots).map(esc).join('<br>')}<p class="sub">${b.paid_at?'Paid '+new Date(b.paid_at).toLocaleString('en-IN'):''}</p>${b.status==='confirmed'?'<button class="btn bad sm" data-cancel="'+esc(b.code)+'">Cancel booking</button>':''}</div>`});return h;}
async function createBooking(){const nm=$('#nm').value.trim(),ph=$('#ph').value.trim(),fe=$('#fe');const err=!nm?'Enter your name.':!/^[6-9]\d{9}$/.test(ph)?'Enter a valid 10-digit Indian mobile number.':'';if(err){fe.textContent=err;fe.hidden=false;return;}S.customerName=nm;S.customerPhone=ph;$('#create').disabled=true;$('#create').textContent='Creating payment QR…';try{const j=await json('/api/create-booking',{method:'POST',body:JSON.stringify({name:nm,phone:ph,slots:ids()})});S.booking=j.bookingCode;S.accessToken=j.accessToken;S.qr=j.qrImageUrl;S.expiresAt=Date.now()+10*60*1000;render();}catch(e){fe.textContent=e.message;fe.hidden=false;$('#create').disabled=false;$('#create').textContent='Try again';}}
let poll=null;function startPaymentPoll(){clearInterval(poll);if(!S.booking||!S.accessToken)return;poll=setInterval(async()=>{const left=Math.max(0,Math.ceil((S.expiresAt-Date.now())/1000));const cd=$('#cd');if(cd)cd.textContent=`Payment QR expires in ${Math.floor(left/60)}:${pad(left%60)}`;try{const j=await json(`/api/booking-status?code=${encodeURIComponent(S.booking)}&token=${encodeURIComponent(S.accessToken)}`);if(j.booking.status==='confirmed'){clearInterval(poll);S.doneBooking=j.booking;S.view='done';render();}}catch(e){}if(left<=0){clearInterval(poll);S.info='The payment QR expired. Refresh availability and select your slots again.';S.view='pick';S.sel.clear();S.qr=null;S.booking=null;loadAvailability();}},3000);}
async function loadAdmin(){const j=await json('/api/admin-bookings');S.adminBookings=j.bookings||[];S.view='owner';render();}
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.date){S.date=t.dataset.date;render();}else if(t.dataset.slot){const i=t.dataset.slot;if(S.sel.has(i))S.sel.delete(i);else S.sel.add(i);S.info='';render();}else if(t.id==='go'){if(ids().length){S.view='pay';S.qr=null;render();}}else if(t.dataset.a==='back'){S.view='pick';S.qr=null;render();}else if(t.dataset.a==='again'){S.view='pick';S.sel.clear();S.qr=null;S.booking=null;S.accessToken=null;loadAvailability();}else if(t.dataset.a==='home'){S.view='pick';location.hash='';render();}else if(t.id==='create')createBooking();else if(t.id==='login'){const pw=$('#adminpw').value;try{await json('/api/admin-login',{method:'POST',body:JSON.stringify({password:pw})});await loadAdmin();}catch(x){$('#loginerr').textContent=x.message;$('#loginerr').hidden=false;}}else if(t.id==='refreshAdmin')loadAdmin().catch(x=>alert(x.message));else if(t.dataset.cancel){if(confirm('Cancel this confirmed booking and free its slots?')){try{await json('/api/admin-action',{method:'POST',body:JSON.stringify({code:t.dataset.cancel,action:'cancel'})});await loadAdmin();}catch(x){alert(x.message)}}}});
$('#go').addEventListener('click',()=>{if(!ids().length)return;S.view='pay';render();});
$('#logo').innerHTML=LOGO;S.date=dkey(new Date());render();loadAvailability();
if(location.hash==='#owner'){S.view='owner-login';render();}
window.addEventListener('hashchange',()=>{if(location.hash==='#owner'){S.view='owner-login';render();}});
</script></body></html>
